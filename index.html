// Looks up per-100g macros for "name" from the offline fallback list first, then the
// USDA cache. Synchronous and returns null if nothing's cached yet (use ensureNutrition
// alongside this to trigger a background fetch when that happens).
function getNutrition(name,qty){
  qty=qty||100;
  var nl=(resolveAlias(name)||name).toLowerCase().trim();
  var n=null;
  var key=Object.keys(NUTRITION_DB).find(function(k){return k.toLowerCase()===nl;});
  if(!key)key=Object.keys(NUTRITION_DB).find(function(k){return nl.includes(k.toLowerCase())||k.toLowerCase().includes(nl);});
  if(!key){var first=nl.split(' ')[0];key=Object.keys(NUTRITION_DB).find(function(k){return k.toLowerCase()===first;});}
  if(key)n=NUTRITION_DB[key];
  if(!n){
    var ck=Object.keys(S.nutCache).find(function(k){return k===nl||nl.includes(k)||k.includes(nl);});
    if(ck)n=S.nutCache[ck];
  }
  if(!n)return null;
  var m=qty/100;
  return {cal:Math.round(n.cal*m),pro:Math.round(n.pro*m*10)/10,fat:Math.round(n.fat*m*10)/10,carb:Math.round(n.carb*m*10)/10};
}
// Auto-fetches nutrition for an item name from USDA FoodData Central instead of
// requiring it to be added to NUTRITION_DB by hand. Caches the result permanently
// (localStorage) so each item name is only ever looked up once, then re-renders.
async function ensureNutrition(name){
  if(!name)return;
  var searchName=resolveAlias(name)||name; // e.g. "Badam" -> "Almonds" for a real API hit
  var nl=searchName.toLowerCase().trim();
  if(getNutrition(name))return; // already have it locally or cached
  if(_nutFetching[nl])return; // already tried/in-flight this session
  _nutFetching[nl]=true;
  try{
    var get=function(food,key){
      var f=(food.foodNutrients||[]).find(function(x){return x.nutrientId===NUTRIENT_IDS[key]||x.nutrientNumber===NUTRIENT_NUMBERS[key];});
      return f?(f.value||f.amount||0):0;
    };
    var tryFetch=async function(dataTypeParam){
      var url='https://api.nal.usda.gov/fdc/v1/foods/search?query='+encodeURIComponent(searchName)+'&pageSize=5&api_key='+USDA_API_KEY+(dataTypeParam?'&dataType='+dataTypeParam:'');
      var r=await fetch(url);
      if(!r.ok){
        if(r.status===429)console.warn('USDA API rate limit hit - get your own free key at fdc.nal.usda.gov/api-key-signup');
        else console.warn('USDA API error',r.status,'for',searchName);
        return null;
      }
      var d=await r.json();
      return d.foods||[];
    };
    // Pass 1: generic, unprocessed foods only - most reliable per-100g values,
    // avoids accidentally matching a sugary/processed branded product by the same name.
    var foods=await tryFetch('Foundation,SR%20Legacy,Survey%20(FNDDS)');
    // Pass 2: fall back to the full database (incl. Branded) if nothing generic matched.
    if(!foods||!foods.length)foods=await tryFetch(null);
    if(!foods||!foods.length){console.warn('USDA: no results for',name);return;}
    var food=foods[0];
    var n={cal:Math.round(get(food,'cal')),pro:get(food,'pro'),fat:get(food,'fat'),carb:get(food,'carb')};
    if(n.cal>0||n.pro>0){S.nutCache[nl]=n;svNut();render();}
    else console.warn('USDA: found',food.description,'but no usable macro data for',name);
  }catch(e){console.warn('USDA lookup failed for',name,e);}
}
function round1(n){return Math.round((n+Number.EPSILON)*10)/10;}
// ====== SPENDING ANALYTICS ======
// Purchase date is derived from each item's id (a Date.now() timestamp set when added),
// so no extra field is needed to know "when" - only price is optional user input.
// Both functions now read from the persistent S.purchases log (not S.items) so spending
// history survives an item being edited, refilled, used up or deleted.
function getDailySpending(days){
  days=days||14;
  var map={},order=[];
  var today0=new Date();today0.setHours(0,0,0,0);
  for(var i=days-1;i>=0;i--){
    var d=new Date(today0);d.setDate(d.getDate()-i);
    var key=d.toISOString().split('T')[0];
    map[key]=0;order.push(key);
  }
  S.purchases.forEach(function(p){
    if(!p.price)return;
    var key=new Date(p.ts).toISOString().split('T')[0];
    if(key in map)map[key]+=p.price;
  });
  return order.map(function(k){
    var d=new Date(k);
    return{label:d.getDate()+'/'+(d.getMonth()+1),amount:round1(map[k])};
  });
}
function getMonthlySpending(months){
  months=months||6;
  var map={},order=[];
  var now=new Date();
  var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  for(var i=months-1;i>=0;i--){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var key=d.getFullYear()+'-'+(d.getMonth()+1);
    map[key]=0;order.push({key:key,label:MN[d.getMonth()]});
  }
  S.purchases.forEach(function(p){
    if(!p.price)return;
    var d=new Date(p.ts);
    var key=d.getFullYear()+'-'+(d.getMonth()+1);
    if(key in map)map[key]+=p.price;
  });
  return order.map(function(o){return{label:o.label,amount:round1(map[o.key])};});
}

}

// Simple hand-rolled bar chart (no external chart library needed) - bars sized as a
// % of the tallest bar within a fixed-height track, with a value label on non-zero bars.
function barChartHTML(data,height){
  height=height||110;
  var max=Math.max.apply(null,data.map(function(d){return d.amount;}).concat([1]));
  var h='<div style="display:flex;align-items:flex-end;gap:4px;height:'+height+'px;padding:6px 2px 0">';
  data.forEach(function(d){
    var pct=max>0?Math.max((d.amount/max)*100,d.amount>0?6:1):1;
    h+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0">';
    if(d.amount>0)h+='<div style="font-size:8px;color:#2d6a4f;font-weight:800;margin-bottom:2px;writing-mode:vertical-rl;transform:rotate(180deg);max-height:26px;overflow:hidden">₹'+Math.round(d.amount)+'</div>';
    h+='<div style="width:100%;max-width:20px;background:linear-gradient(180deg,#52b788,#2d6a4f);border-radius:4px 4px 0 0;height:'+pct+'%"></div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div style="display:flex;gap:4px;padding:4px 2px 0">';
  data.forEach(function(d){h+='<div style="flex:1;text-align:center;font-size:9px;color:#aaa;min-width:0">'+d.label+'</div>';});
  h+='</div>';
  return h;
}

// Aggregates category totals from a list of {category,price,qty} records into a
// sorted array (highest spend first).
function categoryBreakdown(list){
  var map={};
  list.forEach(function(p){
    var c=p.category||'Other';
    map[c]=(map[c]||0)+(p.price||0);
  });
  return Object.keys(map).map(function(c){return{category:c,amount:round1(map[c])};}).sort(function(a,b){return b.amount-a.amount;});
}
// Aggregates per-item totals (spend, times bought, total qty) from purchase records.
function itemBreakdown(list){
  var map={};
  list.forEach(function(p){
    var k=(p.name||'').trim().toLowerCase();
    if(!k)return;
    if(!map[k])map[k]={name:p.name,category:p.category,spend:0,count:0,qty:0,unit:p.unit};
    map[k].spend+=(p.price||0);map[k].count+=1;map[k].qty+=(parseFloat(p.qty)||0);
  });
  return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return b.spend-a.spend;});
}

var PIECE_WEIGHTS={

  if(!key)key=Object.keys(PIECE_WEIGHTS).find(function(k){return nl.includes(k.toLowerCase());});

// Matches whole words in the name against ITEM_ALIASES (e.g. "Badam" or "Kaju Badam Mix").
function resolveAlias(name){
  var words=(name||'').toLowerCase().trim().split(/\s+/);
  for(var i=0;i<words.length;i++){if(ITEM_ALIASES[words[i]])return ITEM_ALIASES[words[i]];}

  }
  return null;
}

var synth=window.speechSynthesis;

function speak(text){
  synth.cancel();isSpeaking=false;
  if(!text)return;
  var u=new SpeechSynthesisUtterance(text.substring(0,500));
  u.rate=1.0;u.pitch=1.0;u.volume=1.0;
  var voices=synth.getVoices();
  var pref=voices.find(function(v){return v.lang.includes('en')&&v.name.includes('Google');});
  if(!pref)pref=voices.find(function(v){return v.lang.includes('en');});
  if(pref)u.voice=pref;
  isSpeaking=true;
  u.onend=function(){isSpeaking=false;if(voiceContinuous&&S.showChat)setTimeout(startListening,500);render();};
  synth.speak(u);
}
function stopSpeaking(){synth.cancel();isSpeaking=false;}

function openChat(){

async function getAIResponse(question){
  var ownKey=getKey();
  var pantry=S.items.length>0?S.items.map(function(i){return i.name+' ['+(i.location||'Pantry')+']'+(i.expiry?' (exp:'+i.expiry+')':'');}).join(', '):'empty pantry';
  var expiring=S.items.filter(function(i){return i.expiry&&gd(i.expiry)<=3;}).map(function(i){return i.name;}).join(', ');
  try{
    var sys='You are a helpful AI assistant. You can talk about ANYTHING - general knowledge, science, jokes, advice, news, cooking, health, and more. You are also integrated into a Smart Grocery app. User pantry: '+pantry+'. Expiring soon: '+(expiring||'nothing')+'. For recipes give very detailed steps with exact quantities. Be friendly and conversational.';
    var hist=S.chatHistory.slice(-8).map(function(m){return{role:m.role==='user'?'user':'assistant',content:m.text};});
    var payload={model:'openrouter/auto',max_tokens:1000,messages:[{role:'system',content:sys},...hist,{role:'user',content:question}]};
    var r;
    if(ownKey){
      // User supplied their own OpenRouter key in Profile - call OpenRouter directly with it.
      r=await fetch('https://openrouter.ai/api/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+ownKey,'HTTP-Referer':'https://abhiiii009.github.io','X-Title':'Smart Grocery'},
        body:JSON.stringify(payload)
      });
    }else{
      // Default path - call our own Netlify function, which holds the real key server-side.
      r=await fetch(AI_PROXY_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
    }
    var d=await r.json();
    if(d.error)return 'Error: '+(d.error.message||d.error);
    return ((d.choices||[])[0]||{}).message.content||'Sorry I could not process that.';
  }catch(e){return handleOffline(question,pantry,expiring);}
}

function handleOffline(q,pantry,expiring){
  var ql=q.toLowerCase();
  if(ql.includes('expir')){return expiring?'Expiring soon: '+expiring:'Nothing expiring soon!';}
  if(ql.includes('how many')||ql.includes('count')){return 'You have '+S.items.length+' items in your pantry.';}
  if(ql.includes('hello')||ql.includes('hi')||ql.includes('hey')){return 'Hey! Ask me anything about your pantry.';}
  if(ql.includes('cook')||ql.includes('recipe')){suggestRecipes();return 'Opening recipes!';}
  if(ql.includes('scan')){setTimeout(openScanner,500);return 'Opening scanner!';}
  if(ql.includes('add')){S.editId=null;S.form={name:'',category:'Other',quantity:'1',unit:'pcs',expiry:'',mfd:'',location:'Pantry',catTouched:false,price:''};S.showAdd=true;render();return 'Opening add form!';}

}

function startListening(){
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){toast('Voice needs Chrome browser!',true);return;}

  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.lang='en-IN';recognition.interimResults=false;recognition.maxAlternatives=1;

}

  var exp=avail.filter(function(i){return i.expiry&&gd(i.expiry)<=3;});

async function captureExpiry(){
  showCap(false);showSkip(false);
  setMsg('Hold still... 3');await new Promise(function(r){setTimeout(r,1000);});
  setMsg('Hold still... 2');await new Promise(function(r){setTimeout(r,1000);});
  setMsg('Hold still... 1');await new Promise(function(r){setTimeout(r,1000);});
  setMsg('Reading dates...');
  var vid=document.getElementById('expiry-vid');
  var canvas=document.getElementById('sg-canvas');
  if(!vid||!canvas){skipExpiry();return;}
  canvas.width=vid.videoWidth||1280;canvas.height=vid.videoHeight||720;
  canvas.getContext('2d').drawImage(vid,0,0);
  var cw=canvas.width*0.85,ch=canvas.height*0.6,cx=(canvas.width-cw)/2,cy=(canvas.height-ch)/2;
  var c2=document.createElement('canvas');c2.width=cw*2;c2.height=ch*2;
  var c2x=c2.getContext('2d');c2x.drawImage(canvas,cx,cy,cw,ch,0,0,c2.width,c2.height);
  var id=c2x.getImageData(0,0,c2.width,c2.height);var px=id.data;
  for(var i=0;i<px.length;i+=4){var g=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];var v=g<128?Math.max(0,g-50):Math.min(255,g+50);px[i]=px[i+1]=px[i+2]=v;}
  c2x.putImageData(id,0,0);
  stopAllCameras();
  var result={exp:null,mfd:null};
  if(typeof Tesseract!=='undefined'){
    try{
      var res=await Tesseract.recognize(c2,'eng',{logger:function(){}});
      var txt=res.data.text;
      result.exp=extractDate(txt,['EXP','EXPIRY','EXPIRATION','BEST BEFORE','USE BY','BBE','BB']);
      result.mfd=extractDate(txt,['MFD','MFG','MANUFACTURED','PACKED','PKD','DOM']);
    }catch(e){}
  }
  applyDateResult(result);
}

// ====== DATE PARSER ======
function extractDate(txt,kws){
  var M={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12};
  var u=txt.toUpperCase().replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/\n/g,' ');
  var yr=new Date().getFullYear();
  for(var i=0;i<kws.length;i++){var idx=u.indexOf(kws[i]);if(idx===-1)continue;var after=u.substring(idx+kws[i].length,idx+kws[i].length+40);var d=psd(after,M,yr);if(d)return d;}
  return psd(u,M,yr);
}
function psd(t,M,yr){
  var m;
  m=t.match(/(\d{1,2})[\-\/\. ]*(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[\-\/\. ]*(\d{2,4})/);if(m){var y=+m[3];if(y<100)y+=2000;if(y>=2020&&y<=2040)return y+'-'+String(M[m[2]]).padStart(2,'0')+'-'+m[1].padStart(2,'0');}
  m=t.match(/(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)[\-\/\. ]*(\d{2,4})/);if(m){var y=+m[2];if(y<100)y+=2000;if(y>=2020&&y<=2040)return y+'-'+String(M[m[1]]).padStart(2,'0')+'-01';}
  m=t.match(/(\d{1,2})[\-\/](\d{4})/);if(m&&+m[1]<=12&&+m[2]>=2020&&+m[2]<=2040)return m[2]+'-'+m[1].padStart(2,'0')+'-01';
  m=t.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);if(m){var y=+m[3];if(y<100)y+=2000;if(y>=2020&&y<=2040&&+m[2]<=12)return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}
  return null;
}

async function startProductCamera(){
  setProductMsg('Requesting camera...');
  try{
    // Try constraints in order - most specific to least
    var stream=null;
    var attempts=[
      {video:{facingMode:{exact:'environment'}}},
      {video:{facingMode:'environment'}},
      {video:true}
    ];
    for(var i=0;i<attempts.length;i++){
      try{stream=await navigator.mediaDevices.getUserMedia(attempts[i]);break;}
      catch(e){if(i===attempts.length-1)throw e;}
    }
    productScanStream=stream;
    var wrap=document.getElementById('product-cam-wrap');
    if(!wrap){stopAllCameras();return;}
    // Remove old video
    var old=document.getElementById('product-vid');
    if(old){try{old.srcObject=null;}catch(e){}old.remove();}
    // Create video element
    var vid=document.createElement('video');
    vid.id='product-vid';
    vid.autoplay=true;vid.playsInline=true;vid.muted=true;
    vid.setAttribute('playsinline','');
    vid.setAttribute('webkit-playsinline','');
    vid.style.cssText='width:100%;height:100%;object-fit:cover;display:block;position:absolute;top:0;left:0;z-index:1';
    wrap.appendChild(vid);
    vid.srcObject=stream;
    // Wait for video ready
    await new Promise(function(res){
      vid.onloadedmetadata=res;
      setTimeout(res,4000);
    });
    try{await vid.play();}catch(pe){}
    setProductMsg('Aim at product clearly, then tap Identify!');
  }catch(e){
    var msg='Camera error: ';
    if(e.name==='NotAllowedError')msg+='Allow camera in browser settings.';
    else if(e.name==='NotFoundError')msg+='No camera found on device.';
    else if(e.name==='NotReadableError')msg+='Camera busy. Close other apps then retry.';
    else msg+=(e.message||'Unknown error');
    setProductMsg(msg);
  }
}

    var key=getKey();
    var prompt='I am tracking macros for '+goalType+'. I still need '+remCal+' kcal and '+remPro+'g protein today. My pantry has: '+pantry+'. Give me 3 specific meal recommendations with estimated macros for each. Keep it concise and practical.';
    var payload={model:'openrouter/auto',max_tokens:600,messages:[{role:'user',content:prompt}]};
    var r;
    if(key){
      r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(payload)});
    }else{
      var proxyUrl=store.get('proxy_url')||'';
      if(!proxyUrl){S.gymRecs='Add your OpenRouter key in Profile to get AI recommendations.';render();return;}
      r=await fetch(proxyUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    }
    var d=await r.json();
    S.gymRecs=((d.choices||[])[0]||{}).message.content||'Could not get recommendations.';
  }catch(e){S.gymRecs='Error getting recommendations. Check your API key in Profile.';}
  render();
}
function toggleCheck(id){S.items=S.items.map(function(i){return i.id===id?Object.assign({},i,{checked:!i.checked}):i;});sv();render();}

// ====== RENDER ======
function getFilteredItems(){
  var items=S.items,fil=items.filter(function(i){
    var matchesSearch=i.name.toLowerCase().includes(S.search.toLowerCase());
    var matchesLoc=S.selectedLocation==='All'||(i.location||'Pantry')===S.selectedLocation;
    return matchesSearch&&matchesLoc;
  });
  fil=fil.slice().sort(function(a,b){
    if(S.sortBy==='name')return a.name.localeCompare(b.name);
    if(S.sortBy==='category')return (a.category||'').localeCompare(b.category||'');
    return gd(a.expiry)-gd(b.expiry); // default: soonest expiry first
  });
  return{items:items,fil:fil};
}

// Lightweight refresh for search/typing: only swaps the list container's contents,
// so the search <input> never gets destroyed/recreated and never loses focus or
// closes the keyboard mid-type.
function updateList(){

  el.innerHTML=pantryListHTML(d.items,d.fil);
}

    S.purchases.slice().sort(function(a,b){return b.ts-a.ts;}).slice(0,15).forEach(function(p){

    }
  }

  // ====== FITNESS TAB ======

    var barColor=function(v,m){return v>=m?'#e03131':v>=m*0.8?'#2d6a4f':'#40916c';};
    h+='<div class="hdr"><p style="font-size:11px;opacity:.8;letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">Daily Macro Tracker</p><h1>Fitness 💪</h1>';
    h+='<div class="stats"><div class="stat"><div class="n">'+totals.cal+'</div><div class="l">/ '+goal.calories+' kcal</div></div>';
    h+='<div class="stat"><div class="n">'+totals.pro+'g</div><div class="l">/ '+goal.protein+'g protein</div></div>';
    h+='<div class="stat"><div class="n" style="font-size:14px">'+(S.fitness.profile.goal||'muscle').toUpperCase()+'</div><div class="l">Goal</div></div></div></div>';
    h+='<div style="display:flex;justify-content:flex-end;margin-bottom:16px">';
    h+='<button class="info-btn" onclick="S.showFitness=!S.showFitness;render()" style="padding:6px 12px;font-size:12px">⚙️ Goals</button>';
    h+='</div>';

    // Goal setup panel
    if(S.showFitness){
      h+='<div class="fit-card" style="border:2px solid #2d6a4f">';
      h+='<p style="font-weight:900;margin-bottom:12px;color:#2d6a4f">Set Your Daily Goals</p>';
      h+='<p style="font-size:11px;font-weight:700;color:#888;margin-bottom:4px">GOAL TYPE</p>';
      h+='<div style="display:flex;gap:8px;margin-bottom:12px">';
      [['muscle','💪 Muscle Gain'],['loss','🔥 Fat Loss'],['maintain','⚖️ Maintain']].forEach(function(g){
        var on=(fit.profile.goal||'muscle')===g[0];

      });
      h+='</div>';
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
      [['Calories (kcal)','calories'],['Protein (g)','protein'],['Fat (g)','fat'],['Carbs (g)','carbs']].forEach(function(f){
        h+='<div><p style="font-size:11px;font-weight:700;color:#888;margin-bottom:4px">'+f[0]+'</p><input type="number" value="'+goal[f[1]]+'" oninput="S.fitness.goal.'+f[1]+'=+this.value;sv()" style="width:100%;padding:8px;border-radius:10px;border:1px solid #e9ecef;font-size:14px;font-weight:700"/></div>';
      });
      h+='</div>';
      h+='<p style="font-size:11px;color:#888;margin-top:10px">Tip: For muscle gain try 2500kcal, 150g protein. For fat loss try 1800kcal, 130g protein.</p>';
      h+='</div>';
    }

    // Today's progress rings
    h+='<div class="fit-card">';
    h+='<p style="font-weight:900;color:#333;margin-bottom:10px">Today\'s Progress</p>';
    h+='<div class="fit-ring">';
    [{l:'Calories',v:totals.cal,m:goal.calories,u:'kcal',c:'#e8590c'},{l:'Protein',v:totals.pro,m:goal.protein,u:'g',c:'#2d6a4f'},{l:'Fat',v:totals.fat,m:goal.fat,u:'g',c:'#f08c00'},{l:'Carbs',v:totals.carb,m:goal.carbs,u:'g',c:'#1971c2'}].forEach(function(m){
      h+='<div class="fit-ring-item"><div class="fit-ring-num" style="color:'+m.c+'">'+m.v+'</div><div style="font-size:9px;color:#aaa">/ '+m.m+m.u+'</div><div class="fit-ring-lbl">'+m.l+'</div><div class="macro-bar"><div class="macro-fill" style="width:'+pct(m.v,m.m)+'%;background:'+barColor(m.v,m.m)+'"></div></div></div>';
    });
    h+='</div>';
    // Remaining
    var remCal=Math.max(0,goal.calories-totals.cal);
    var remPro=Math.max(0,goal.protein-totals.pro);
    h+='<p style="font-size:12px;color:#555;font-weight:700">Remaining: <span style="color:#2d6a4f">'+remCal+' kcal</span> · <span style="color:#2d6a4f">'+remPro+'g protein</span></p>';
    h+='</div>';

    // Log food from pantry
    h+='<div class="fit-card">';
    h+='<p style="font-weight:900;color:#333;margin-bottom:10px">Log Food from Pantry</p>';
    h+='<div style="display:flex;gap:8px;margin-bottom:8px">';
    h+='<select onchange="S.fitLogForm.name=this.value" style="flex:2;padding:8px;border-radius:10px;border:1px solid #e9ecef;font-size:13px">';
    h+='<option value="">Pick item...</option>';
    S.items.filter(function(i){return !i.expired;}).forEach(function(i){
      var hasNut=!!getNutrition(i.name);
      if(!hasNut)ensureNutrition(i.name); // quietly looks it up in the background so it self-populates
      h+='<option value="'+i.name+'"'+(hasNut?'':' style="color:#bbb"')+'>'+i.name+(hasNut?' ✓':' (looking up…)')+'</option>';
    });
    h+='</select>';
    h+='<input type="number" placeholder="Qty" value="'+S.fitLogForm.qty+'" oninput="S.fitLogForm.qty=+this.value" style="flex:1;padding:8px;border-radius:10px;border:1px solid #e9ecef;font-size:13px;font-weight:700"/>';
    h+='<select onchange="S.fitLogForm.unit=this.value;render()" style="flex:1;padding:8px;border-radius:10px;border:1px solid #e9ecef;font-size:13px">';
    h+='<option value="g"'+(S.fitLogForm.unit==='g'?' selected':'')+'>grams</option>';
    h+='<option value="pcs"'+(S.fitLogForm.unit==='pcs'?' selected':'')+'>pcs</option>';
    h+='</select>';
    h+='<button class="log-btn" onclick="logFood(S.fitLogForm.name,gramsFor(S.fitLogForm.name,S.fitLogForm.qty,S.fitLogForm.unit))">Log</button>';
    h+='</div>';
    h+='<p style="font-size:11px;color:#aaa">✓ = nutrition data available. Switch to "pcs" to log by piece (e.g. 2 eggs) - uses an average piece weight.</p>';
    h+='</div>';

    // Today's log
    if(logs.length>0){
      h+='<div class="fit-card">';
      h+='<p style="font-weight:900;color:#333;margin-bottom:10px">Today\'s Log</p>';
      logs.forEach(function(l,i){
        h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f3f3f3">';
        h+='<div><p style="font-weight:800;font-size:13px">'+l.name+' <span style="color:#888;font-weight:600">('+l.qty+'g)</span></p><p style="font-size:11px;color:#2d6a4f">'+l.cal+' kcal · '+l.pro+'g pro · '+l.fat+'g fat · '+l.carb+'g carb</p></div>';
        h+='<button onclick="removeLog('+i+')" style="background:none;border:none;color:#e63946;font-size:18px;cursor:pointer">×</button>';
        h+='</div>';
      });
      h+='</div>';
    }

    // AI Gym Recommendations
    h+='<div class="fit-card" style="border:2px solid #e8f5e9">';
    h+='<p style="font-weight:900;color:#2d6a4f;margin-bottom:6px">🤖 AI Gym Recommendations</p>';
    h+='<p style="font-size:12px;color:#555;margin-bottom:10px">Get AI-powered meal suggestions to hit your remaining '+remCal+' kcal and '+remPro+'g protein from your pantry.</p>';
    h+='<button class="log-btn" style="width:100%;padding:12px" onclick="getGymRecommendations()">Get Recommendations</button>';
    if(S.gymRecs){
      h+='<div style="margin-top:12px;padding:12px;background:#f7f3ee;border-radius:12px;font-size:13px;line-height:1.6;color:#333">'+S.gymRecs.replace(/\n/g,'<br>')+'</div>';
    }
    h+='</div>';
  }

  h+='</div>';
  h+='<button class="fab" onclick="openScanner()">📷 Scan</button>';
  h+='<button class="idfab" onclick="openProductScan()">🔍 Identify</button>';
  h+='<button class="aibtn'+(voiceActive?' listening':'')+'" onclick="openChat()">🤖</button>';

  // Nutrition info popup
  if(S.showNutritionInfo){
    var niName=S.showNutritionInfo;
    var niNut=getNutrition(niName,100);
    h+='<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:290" onclick="S.showNutritionInfo=null;render()"></div>';
    h+='<div class="nut-popup">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">';
    h+='<h3 style="font-family:\'Playfair Display\',serif;font-size:18px">'+niName+'</h3>';
    h+='<button onclick="S.showNutritionInfo=null;render()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#888">×</button>';
    h+='</div>';
    if(niNut){
      h+='<p style="font-size:11px;color:#888;font-weight:700;margin-bottom:10px">PER 100g</p>';
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">';
      [{l:'🔥 Calories',v:niNut.cal,u:'kcal'},{l:'💪 Protein',v:niNut.pro,u:'g'},{l:'🧈 Fat',v:niNut.fat,u:'g'},{l:'🌾 Carbs',v:niNut.carb,u:'g'}].forEach(function(m){
        h+='<div style="background:#f7f3ee;border-radius:12px;padding:12px;text-align:center"><div style="font-size:20px;font-weight:900;color:#2d6a4f">'+m.v+'</div><div style="font-size:11px;color:#888">'+m.u+'</div><div style="font-size:11px;font-weight:700;color:#555">'+m.l+'</div></div>';
      });
      h+='</div>';
      h+='<button class="log-btn" style="width:100%;padding:12px" onclick="S.tab=\'fitness\';S.fitLogForm.name=\''+niName+'\';S.showNutritionInfo=null;render()">➕ Log to Fitness Tracker</button>';
      h+='<button onclick="reFetchNutrition(\''+niName+'\')" style="width:100%;background:none;border:none;color:#aaa;font-size:11px;padding:10px 0 0;cursor:pointer;font-family:inherit">↻ Numbers look wrong? Tap to re-fetch</button>';
    }else if(_nutFetching[niName.toLowerCase().trim()]){
      h+='<p style="color:#888;font-size:13px">Looking up nutrition data…</p>';
    }else{
      h+='<p style="color:#888;font-size:13px">No nutrition data found for this item.<br>You can search for it in the Fitness tab to log it manually.</p>';
    }
    h+='</div>';
  }

  // BOTTOM NAV
  h+='<div class="bnav">';
  [['home','🏠','Home'],['alerts','🔔','Alerts'],['fitness','💪','Fitness'],['analysis','🧾','Food'],['profile','👤','Profile']].forEach(function(x){
    h+='<div class="ni" onclick="switchTab(\''+x[0]+'\')">';
    h+='<span class="ni-i">'+x[1]+'</span>';
    h+='<span class="ni-l'+(S.tab===x[0]?' a':'')+'">'+x[2]+'</span>';
    if(S.tab===x[0])h+='<div class="ni-d"></div>';
    h+='</div>';
  });
  h+='</div>';

  document.getElementById('app').innerHTML=h;

  // Keep the Android/browser back button inside the app instead of closing it -
  // whenever we're "deeper" than the Home tab with nothing open, arm a history
  // guard so the next back press is caught by popstate below.
  var isDeep=S.tab!=='home'||S.showAdd||S.showChat||S.showRecipes||S.showRecipeDetail||S.showNutritionInfo||S.showSheet||S.showScan;
  if(isDeep)pushNavGuard();
}

// ====== BACK BUTTON HANDLING ======
// We never navigate anywhere for real - instead we push a harmless history
// entry whenever the user opens a modal or leaves the Home tab. Pressing back
// then just pops that entry (caught below) and we close whatever's open /
// return to Home, re-arming the guard each time until we're back at the true
// root, at which point the next back press exits the app as normal.
var _navGuardActive=false;
function pushNavGuard(){
  if(!_navGuardActive){
    try{history.pushState({guard:true},'');_navGuardActive=true;}catch(e){}
  }
}
function closeTopmostOverlay(){
  if(S.showChat){closeChat();return true;}
  if(S.showRecipeDetail){S.showRecipeDetail=null;S.showRecipes=true;render();return true;}
  if(S.showRecipes){S.showRecipes=false;render();return true;}
  if(S.showNutritionInfo){S.showNutritionInfo=null;render();return true;}
  if(S.showSheet){S.showSheet=false;render();return true;}
  if(S.showAdd){S.showAdd=false;render();return true;}
  if(S.showScan){closeScanner();return true;}
  var psm=document.getElementById('product-scan-modal');
  if(psm&&psm.style.display==='flex'){closeProductScan();return true;}
  if(S.tab!=='home'){S.tab='home';render();return true;}
  return false;
}
window.addEventListener('popstate',function(){
  _navGuardActive=false;
  var closed=closeTopmostOverlay();
  var stillDeep=S.tab!=='home'||S.showAdd||S.showChat||S.showRecipes||S.showRecipeDetail||S.showNutritionInfo||S.showSheet||S.showScan;
  if(closed&&stillDeep)pushNavGuard();
});

// Hide the floating action buttons while any text field has focus - avoids them
// jumping/overlapping the keyboard or covering content mid-type.
document.addEventListener('focusin',function(e){
  if(e.target.matches('input,select,textarea'))document.body.classList.add('kbd-open');
});
document.addEventListener('focusout',function(e){
  if(e.target.matches('input,select,textarea'))setTimeout(function(){
    if(!document.activeElement||!document.activeElement.matches('input,select,textarea'))document.body.classList.remove('kbd-open');
  },100);
});

render();
initNotifications();
</script>
